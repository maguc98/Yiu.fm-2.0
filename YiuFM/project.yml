name: YiuFM
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  YiuFM:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yiufm.placeholder
        PRODUCT_NAME: Yiu.fm
        INFOPLIST_KEY_CFBundleDisplayName: Yiu.fm
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
