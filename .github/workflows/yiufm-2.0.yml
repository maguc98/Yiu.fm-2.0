name: Build Yiu.fm 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - development-2.0
      - refactor/yiu-2.0-layered-architecture
      - fix/folia-bundle-boot-diagnostics
    paths:
      - "APP/**"
      - "YiuFM/**"
      - ".github/workflows/yiufm-2.0.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for Folia Fume bundle
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build pinned Folia Fume browser bundle
        run: |
          FOLIA_SHA="38f100a3728c23ca71c0d9c58bbede304d97e3b9"
          FOLIA_DIR="$RUNNER_TEMP/folia-fume-source"
          git clone --filter=blob:none --no-checkout https://github.com/maguc98/folia-major.git "$FOLIA_DIR"
          git -C "$FOLIA_DIR" fetch --depth=1 origin "$FOLIA_SHA"
          git -C "$FOLIA_DIR" checkout --detach "$FOLIA_SHA"
          test "$(git -C "$FOLIA_DIR" rev-parse HEAD)" = "$FOLIA_SHA"
          # Remove only the centered hourglass from Fume's loading overlay; keep the loading bars.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          source = Path(os.environ["RUNNER_TEMP"]) / "folia-fume-source/src/components/visualizer/fume/VisualizerFume.tsx"
          text = source.read_text()
          text, imports = re.subn(r"(?m)^import \{ Hourglass \} from 'lucide-react';\n", "", text, count=1)
          text, icons = re.subn(r"(?m)^[ \t]*<Hourglass\b[^\n]*\n(?:[ \t]+[^\n]*\n){4}", "", text, count=1)
          if imports != 1 or icons != 1 or "Hourglass" in text:
              raise SystemExit(f"Expected one hourglass import and JSX icon; found imports={imports}, icons={icons}.")
          bars_anchor = '                            <div className="flex w-28 flex-col gap-2.5">'
          dots = """                            <div className="flex items-center justify-center gap-2" aria-label="等待中">
                                                  <span className="h-2 w-2 rounded-full animate-bounce" style={{ backgroundColor: colorWithAlpha(theme.primaryColor, 0.72), animationDelay: '0ms' }} />
                                                  <span className="h-2 w-2 rounded-full animate-bounce" style={{ backgroundColor: colorWithAlpha(theme.primaryColor, 0.72), animationDelay: '140ms' }} />
                                                  <span className="h-2 w-2 rounded-full animate-bounce" style={{ backgroundColor: colorWithAlpha(theme.primaryColor, 0.72), animationDelay: '280ms' }} />
                                              </div>
          """
          if text.count(bars_anchor) != 1:
              raise SystemExit("Expected one Fume loading-bar container; refusing to add waiting dots.")
          text = text.replace(bars_anchor, dots + bars_anchor, 1)
          if text.count('aria-label="等待中"') != 1 or text.count("animate-bounce") < 3:
              raise SystemExit("Fume waiting-dot indicator was not inserted correctly.")
          source.write_text(text)
          PY
          cd YiuFM/BuildSupport/fume-folia
          npm install --no-audit --no-fund
          FOLIA_ROOT="$FOLIA_DIR" FUME_OUT_DIR="$GITHUB_WORKSPACE/YiuFM/Resources/Web/APP/fume-folia" npm run build
          test -s "$GITHUB_WORKSPACE/YiuFM/Resources/Web/APP/fume-folia/fume-folia.js"

      - name: Restore Run #13 legacy UI baseline
        run: |
          mkdir -p YiuFM/Resources/Web
          git fetch --no-tags --depth=1 origin b070ae110b9cc143e71c8607466f6c1e85467367
          git archive FETCH_HEAD index.html style.css APP | tar -x -C YiuFM/Resources/Web
          # Ship the branch's Sonnet fixes; keep the legacy UI/assets pinned to the verified baseline.
          cp APP/sonnet-perf-governor.js YiuFM/Resources/Web/APP/sonnet-perf-governor.js
          cp APP/sonnet-adapter.js YiuFM/Resources/Web/APP/sonnet-adapter.js
          # Ship the verified lyric timing/retirement fixes without replacing the pinned legacy UI.
          cp APP/player.js YiuFM/Resources/Web/APP/player.js
          cp APP/song-library.js YiuFM/Resources/Web/APP/song-library.js
          cp APP/renderer.js YiuFM/Resources/Web/APP/renderer.js
          cp APP/visualizer-manager.js YiuFM/Resources/Web/APP/visualizer-manager.js
          # Keep the Partita adapter fix in the app payload; the legacy baseline predates it.
          cp APP/partita-adapter.js YiuFM/Resources/Web/APP/partita-adapter.js
          cp APP/partita-connect.js YiuFM/Resources/Web/APP/partita-connect.js
          mkdir -p YiuFM/Resources/Web/APP/fume
          cp APP/fume/fume.js YiuFM/Resources/Web/APP/fume/fume.js
          cp APP/fume-adapter.js YiuFM/Resources/Web/APP/fume-adapter.js
          cp APP/fume-settings.js YiuFM/Resources/Web/APP/fume-settings.js
          cp APP/fume-audio.js YiuFM/Resources/Web/APP/fume-audio.js
          cp APP/tempera-adapter.js YiuFM/Resources/Web/APP/tempera-adapter.js
          # Ship opt-in frame profiling in the Tempera runtime only.
          cp APP/tempera/tempera.js YiuFM/Resources/Web/APP/tempera/tempera.js
          mkdir -p YiuFM/Resources/Web/APP/runtime
          cp APP/runtime/audio-clock.js YiuFM/Resources/Web/APP/runtime/audio-clock.js
          cp APP/runtime/timeline-scheduler.js YiuFM/Resources/Web/APP/runtime/timeline-scheduler.js
          cp APP/runtime/frame-scheduler.js YiuFM/Resources/Web/APP/runtime/frame-scheduler.js
          cp APP/runtime/frame-rate-limit.js YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          cp APP/frame-rate-settings.js YiuFM/Resources/Web/APP/frame-rate-settings.js
          cp APP/settings-page.js YiuFM/Resources/Web/APP/settings-page.js
          cp APP/runtime/render-coordinator.js YiuFM/Resources/Web/APP/runtime/render-coordinator.js
          cp APP/yiu-runtime.js YiuFM/Resources/Web/APP/yiu-runtime.js
          test -s YiuFM/Resources/Web/index.html
          test -s YiuFM/Resources/Web/style.css
          test -s YiuFM/Resources/Web/APP/sonnet/sonnet.js
          test -s YiuFM/Resources/Web/APP/fume-settings.js
          node --check APP/fume-settings.js
          node --check APP/runtime/frame-rate-limit.js
          node --check APP/frame-rate-settings.js
          node --check APP/settings-page.js
          grep -q 'body.is-fume #sonnetHideWrap' APP/fume-settings.js
          grep -q 'sync(el)' APP/fume-settings.js
          grep -q 'setTimeout(enhanceRanges,0)' APP/fume-settings.js
          node --check APP/fume-adapter.js
          test -s YiuFM/Resources/Web/APP/tempera/tempera-pixi.js
          test -s YiuFM/Resources/Web/APP/lumiere/lumiere-pixi.js
          test -s YiuFM/Resources/Web/APP/partita-vendor.js
          test -s YiuFM/Resources/Web/APP/playback-service.js
          test -s YiuFM/Resources/Web/APP/lyrics-service.js
          test -s YiuFM/Resources/Web/APP/library-service.js
          test -s YiuFM/Resources/Web/APP/playback-preferences-service.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path("YiuFM/Resources/Web/index.html")
          html = page.read_text(encoding="utf-8")
          fps_head_anchor = "</head>"
          fps_head_script = '<script src="./APP/runtime/frame-rate-limit.js?v=20261111c"></script>' + chr(10)
          if html.count(fps_head_anchor) != 1 or fps_head_script.strip() in html:
              raise SystemExit("Expected one document head and no prior frame-rate controller.")
          html = html.replace(fps_head_anchor, fps_head_script + fps_head_anchor, 1)
          old_anchor = '<script src="./APP/player.js?v=20261029a"></script>'
          anchor = '<script src="./APP/player.js?v=20261102c"></script>'
          injected = '<script src="./APP/runtime/frame-scheduler.js?v=20261102a"></script>\n' + anchor + '\n<script src="./APP/playback-service.js?v=1"></script>\n<script src="./APP/playback-preferences-service.js?v=1"></script>\n<script src="./APP/lyrics-service.js?v=1"></script>\n<script src="./APP/library-service.js?v=1"></script>\n<script src="./APP/runtime/audio-clock.js?v=20261102a"></script>\n<script src="./APP/runtime/timeline-scheduler.js?v=20261102d"></script>\n<script src="./APP/yiu-runtime.js?v=20261102c"></script>'
          if html.count(old_anchor) != 1:
              raise SystemExit("Expected exactly one legacy player.js script tag; refusing to patch the UI.")
          html = html.replace(old_anchor, anchor, 1)
          manager_tag = '<script src="./APP/visualizer-manager.js?v=20261105a"></script>'
          if html.count(manager_tag) != 1:
              raise SystemExit("Expected exactly one visualizer manager script tag; refusing to patch.")
          html = html.replace(manager_tag, '<script src="./APP/fume/fume.js?v=20261109c"></script>\n<script src="./APP/fume-folia/fume-folia.js?v=20261109c"></script>\n<script src="./APP/fume-audio.js?v=20261109b"></script>\n<script src="./APP/fume-adapter.js?v=20261111a"></script>\n' + manager_tag + '\n<script src="./APP/runtime/render-coordinator.js?v=20261109c"></script>', 1)
          html = html.replace('<script src="./APP/renderer.js?v=20261105d"></script>', '<script src="./APP/renderer.js?v=20261102a"></script>', 1)
          old_sonnet_engine = "sonnet:[\'./APP/sonnet/sonnet.js?v=20261028b\',\'./APP/sonnet-perf-governor.js?v=20261028a\'],"
          new_sonnet_engine = "sonnet:[\'./APP/sonnet/sonnet.js?v=20261102c\',\'./APP/sonnet-perf-governor.js?v=20261028a\'],"
          if html.count(old_sonnet_engine) != 1:
              raise SystemExit("Expected exactly one Sonnet engine loader entry; refusing to patch.")
          html = html.replace(old_sonnet_engine, new_sonnet_engine, 1)
          old_sonnet = '<script src="./APP/sonnet-adapter.js?v=20261029a"></script>'
          new_sonnet = '<script src="./APP/sonnet-adapter.js?v=20261111a"></script>'
          if html.count(old_sonnet) != 1:
              raise SystemExit("Expected exactly one Sonnet adapter script tag; refusing to patch the UI.")
          html = html.replace(old_sonnet, new_sonnet, 1)
          host_anchor = '<div id="partitaHost"></div>'
          if html.count(host_anchor) != 1:
              raise SystemExit("Expected exactly one Partita host; refusing to patch.")
          html = html.replace(host_anchor, host_anchor + '<div id="fumeHost"></div>', 1)
          css_anchor = '<style id="partitaHostCSS">#partitaHost{position:absolute;inset:0;display:none}#stage.mode-partita #partitaHost{display:block}#stage.mode-partita #one,#stage.mode-partita #sky{display:none}</style>'
          if html.count(css_anchor) != 1:
              raise SystemExit("Expected exactly one Partita host CSS block; refusing to patch.")
          html = html.replace(css_anchor, css_anchor + '\n<style id="fumeHostCSS">#fumeHost{position:absolute;inset:0;display:none}#stage.mode-fume #fumeHost{display:block}#stage.mode-fume #one,#stage.mode-fume #sky{display:none}</style>', 1)
          old_p1 = '<script src="./APP/P1.js?v=1"></script>'
          new_p1 = '<script src="./APP/P1.js?v=20261107c"></script>'
          if html.count(old_p1) != 1:
              raise SystemExit("Expected exactly one Partita bundle script tag; refusing to patch.")
          html = html.replace(old_p1, new_p1, 1)
          old_connect = '<script src="./APP/partita-connect.js?v=1"></script>'
          new_connect = '<script src="./APP/partita-connect.js?v=20261107b"></script>'
          if html.count(old_connect) != 1:
              raise SystemExit("Expected exactly one Partita connect script tag; refusing to patch.")
          html = html.replace(old_connect, new_connect, 1)
          old_tempera = '<script src="./APP/tempera-adapter.js?v=20261105g"></script>'
          new_tempera = '<script src="./APP/tempera-adapter.js?v=20261111a"></script>'
          if html.count(old_tempera) != 1:
              raise SystemExit("Expected exactly one Tempera adapter script tag; refusing to patch.")
          html = html.replace(old_tempera, new_tempera, 1)
          old_tempera = "'./APP/tempera/tempera.js?v=20261105c'"
          new_tempera = "'./APP/tempera/tempera.js?v=20261108i'"
          if html.count(old_tempera) != 1:
              raise SystemExit("Expected exactly one Tempera runtime loader entry; refusing to patch.")
          html = html.replace(old_tempera, new_tempera, 1)
          old_partita = '<script src="./APP/partita-adapter.js?v=1"></script>'
          new_partita = '<script src="./APP/partita-adapter.js?v=20261102c"></script>'
          if html.count(old_partita) != 1:
              raise SystemExit("Expected exactly one Partita adapter script tag; refusing to patch the UI.")
          html = html.replace(old_partita, new_partita, 1)
          if any(name in html for name in ("playback-service.js", "lyrics-service.js", "library-service.js")):
              raise SystemExit("A service facade is already injected; refusing duplicate insertion.")
          html = html.replace(anchor, injected, 1)
          menus_anchor = '<script src="./APP/menus.js?v=20261025b"></script>'
          fps_settings_script = '<script src="./APP/frame-rate-settings.js?v=20261111c"></script>'
          full_settings_script = '<script src="./APP/settings-page.js?v=20261112f"></script>'
          if html.count(menus_anchor) != 1 or fps_settings_script in html or full_settings_script in html:
              raise SystemExit("Expected one menus.js anchor and no prior settings scripts.")
          html = html.replace(menus_anchor, menus_anchor + chr(10) + fps_settings_script + chr(10) + full_settings_script, 1)
          settings_script = '<script src="./APP/fume-settings.js?v=20261111d"></script>\n'
          fx_anchor = '<script id="fxScript">'
          if html.count(fx_anchor) != 1 or settings_script.strip() in html:
              raise SystemExit("Expected one StyleFX script anchor and no prior Fume settings script.")
          html = html.replace(fx_anchor, settings_script + fx_anchor, 1)
          ids_old = 'IDS=["sbox","pbox","starbox","fadebox","typebox","posterbox","fxbox","sonnetbox"],'
          ids_new = 'IDS=["sbox","pbox","starbox","fadebox","typebox","posterbox","fxbox","sonnetbox","fumebox"],'
          if html.count(ids_old) != 1:
              raise SystemExit("Expected one StyleFX panel ID list; refusing to patch.")
          html = html.replace(ids_old, ids_new, 1)
          host_old = 'if(st.classList.contains("mode-partita"))return document.getElementById("partitaHost");'
          host_new = host_old + '\n    if(st.classList.contains("mode-fume"))return document.getElementById("fumeHost");'
          if html.count(host_old) != 1:
              raise SystemExit("Expected one Partita StyleFX host branch; refusing to patch.")
          html = html.replace(host_old, host_new, 1)
          content_old = 'h.id==="partitaHost"||h.childElementCount>0'
          content_new = 'h.id==="partitaHost"||h.id==="fumeHost"||h.childElementCount>0'
          if html.count(content_old) != 1:
              raise SystemExit("Expected one StyleFX host content predicate; refusing to patch.")
          html = html.replace(content_old, content_new, 1)
          page.write_text(html, encoding="utf-8")

          music = Path("YiuFM/Resources/Web/APP/ios-music.js")
          source = music.read_text(encoding="utf-8")
          old_guard = "if(!window.SongLibrary || !window.SongLibrary.importScanned) return Promise.resolve(null);"
          new_guard = "var library = window.YiuLibrary || window.SongLibrary;\n    if(!library || !library.importScanned) return Promise.resolve(null);"
          old_call = "return window.SongLibrary.importScanned(items, {"
          new_call = "return library.importScanned(items, {"
          if source.count(old_guard) != 1 or source.count(old_call) != 1:
              raise SystemExit("Expected exact legacy iOS import call sites; refusing to patch.")
          source = source.replace(old_guard, new_guard, 1).replace(old_call, new_call, 1)
          music.write_text(source, encoding="utf-8")
          PY
          python3 YiuFM/Scripts/patch-mini-player-refresh.py
          python3 YiuFM/Scripts/patch-mini-bar-events.py
          python3 YiuFM/Scripts/patch-player-library-consumer.py
          python3 YiuFM/Scripts/patch-playback-preferences.py
          python3 YiuFM/Scripts/patch-visualizer-lifecycle.py
          python3 YiuFM/Scripts/patch-partita-word-clock.py
          python3 YiuFM/Scripts/patch-sonnet-native-resolution.py
          grep -q 'APP/playback-service.js?v=1' YiuFM/Resources/Web/index.html
          node --check YiuFM/Resources/Web/APP/playback-service.js
          node --check YiuFM/Resources/Web/APP/playback-preferences-service.js
          node --check YiuFM/Resources/Web/APP/lyrics-service.js
          node --check YiuFM/Resources/Web/APP/library-service.js
          node --check YiuFM/Resources/Web/APP/runtime/audio-clock.js
          node --check YiuFM/Resources/Web/APP/runtime/timeline-scheduler.js
          node --check YiuFM/Resources/Web/APP/runtime/frame-scheduler.js
          node --check YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          node --check YiuFM/Resources/Web/APP/frame-rate-settings.js
          node --check YiuFM/Resources/Web/APP/runtime/render-coordinator.js
          node --check YiuFM/Resources/Web/APP/yiu-runtime.js
          node --check YiuFM/Resources/Web/APP/player.js
          node --check YiuFM/Resources/Web/APP/song-library.js
          grep -q 'VisualizerManager.loadLyrics(TS, WT, LN)' YiuFM/Resources/Web/APP/song-library.js
          node --check YiuFM/Resources/Web/APP/sonnet-perf-governor.js
          node --check YiuFM/Resources/Web/APP/sonnet-adapter.js
          node --check YiuFM/Resources/Web/APP/sonnet/sonnet.js
          node --check YiuFM/Resources/Web/APP/renderer.js
          node --check YiuFM/Resources/Web/APP/fume/fume.js
          node --check YiuFM/Resources/Web/APP/fume-folia/fume-folia.js
          grep -q 'FumeFoliaBundle' YiuFM/Resources/Web/APP/fume-folia/fume-folia.js
          node --check YiuFM/Resources/Web/APP/fume-adapter.js
          node --check YiuFM/Resources/Web/APP/tempera-adapter.js
          node --check YiuFM/Resources/Web/APP/tempera/tempera.js
          grep -q 'window.__TEMPERA_PROFILE__===true' YiuFM/Resources/Web/APP/tempera/tempera.js
          grep -q 'shotsAvg:' YiuFM/Resources/Web/APP/tempera/tempera.js
          grep -q 'filtersAvg:' YiuFM/Resources/Web/APP/tempera/tempera.js
          grep -q 'bindRuntime(rt)' YiuFM/Resources/Web/APP/tempera-adapter.js
          grep -q 'bindRuntime(rt)' YiuFM/Resources/Web/APP/sonnet-adapter.js
          grep -q 'nextFrameAt+=interval' YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          grep -q 'measuredFPS' YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          grep -q 'shouldRender:shouldRender' YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          grep -q 'yiuFrameRateSlider' YiuFM/Resources/Web/APP/frame-rate-settings.js
          grep -q '24,Math.min(60' YiuFM/Resources/Web/APP/runtime/frame-rate-limit.js
          node --check YiuFM/Resources/Web/APP/partita-adapter.js
          node --check YiuFM/Resources/Web/APP/partita-connect.js
          grep -q '1000 / 60' YiuFM/Resources/Web/APP/partita-connect.js
          node --check YiuFM/Resources/Web/APP/P1.js
          node --check YiuFM/Resources/Web/APP/song-library.js
          node --check YiuFM/Resources/Web/APP/ios-music.js
          node --check YiuFM/Resources/Web/APP/mini-player.js
          grep -q 'function karaCssEnd' YiuFM/Resources/Web/APP/player.js
          ! grep -q '间隔太短的字' YiuFM/Resources/Web/APP/player.js
          grep -q 'var _retireWait=o._kara' YiuFM/Resources/Web/APP/renderer.js
          grep -q 'hasWordTimes' YiuFM/Resources/Web/APP/partita-adapter.js
          grep -q 'wordAnimationEnd=' YiuFM/Resources/Web/APP/P1.js
          grep -q 'g>=t.startTime&&g<=h' YiuFM/Resources/Web/APP/P1.js
          grep -q 'y>=b&&y<=h' YiuFM/Resources/Web/APP/P1.js
          grep -q 'Pl,{initial:!1,mode:"wait",children:(0,In.jsx)(St.div,' YiuFM/Resources/Web/APP/P1.js
          ! grep -q 'lineAnimationEnd=' YiuFM/Resources/Web/APP/P1.js
          ! grep -q 'delay:Math.max(E.exit.transition?.delay??0,lineAnimationEnd-e.get())' YiuFM/Resources/Web/APP/P1.js
          grep -q '<input type="range" id="sonnet-res" min="50" max="400" step="25" value="100">' YiuFM/Resources/Web/index.html
          grep -q 'resolution: options.tuning.textureResolution,' YiuFM/Resources/Web/APP/sonnet/sonnet.js
          ! grep -q 'resolution: snapResolutionToTexturePool(width, height, options.tuning.textureResolution)' YiuFM/Resources/Web/APP/sonnet/sonnet.js
          node --test YiuFM/Tests/frame-rate-limit.test.cjs YiuFM/Tests/player-frame-rate.test.cjs YiuFM/Tests/fume-folia-lyrics-adapter.test.cjs YiuFM/Tests/fume-audio.test.cjs YiuFM/Tests/fume-engine.test.cjs YiuFM/Tests/compatibility-services.test.cjs YiuFM/Tests/sonnet-perf-governor.test.cjs YiuFM/Tests/sonnet-adapter.test.cjs YiuFM/Tests/sonnet-resolution-runtime.test.cjs YiuFM/Tests/partita-adapter.test.cjs YiuFM/Tests/partita-word-clock.test.cjs YiuFM/Tests/runtime-scheduler.test.cjs YiuFM/Tests/frame-scheduler.test.cjs YiuFM/Tests/render-coordinator.test.cjs
          du -sh YiuFM/Resources/Web

      - name: Write build provenance manifest
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "app": "Yiu.fm 2.0",
              "sourceBranch": os.environ.get("GITHUB_REF_NAME", ""),
              "sourceCommit": os.environ.get("GITHUB_SHA", ""),
              "workflowRun": os.environ.get("GITHUB_RUN_ID", ""),
              "workflowAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "uiBaselineCommit": "b070ae110b9cc143e71c8607466f6c1e85467367",
              "uiBaselinePolicy": "Run #13 legacy UI baseline with explicitly overlaid branch modules",
              "note": "This artifact is a compatibility build, not a full snapshot of every file on the source branch."
          }
          out = Path("YiuFM/Resources/Web/BUILD-INFO.json")
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Generate project
        run: xcodegen generate --spec YiuFM/project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project YiuFM/YiuFM.xcodeproj \
            -scheme YiuFM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath YiuFM/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Bundle and verify legacy visual engines
        run: |
          trap 'code=$?; echo "::error::Bundle verification failed at: $BASH_COMMAND (exit $code)"; exit $code' ERR
          APP_PATH="$(find YiuFM/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/Web"
          cp -R YiuFM/Resources/Web/. "$APP_PATH/Web/"
          WEB_ROOT="$APP_PATH/Web"
          test -s "$WEB_ROOT/index.html"
          test -s "$WEB_ROOT/style.css"
          test -s "$WEB_ROOT/APP/sonnet/sonnet.js"
          test -s "$WEB_ROOT/APP/tempera/tempera-pixi.js"
          test -s "$WEB_ROOT/APP/lumiere/lumiere-pixi.js"
          test -s "$WEB_ROOT/APP/partita-vendor.js"
          test -s "$WEB_ROOT/APP/visualizer-manager.js"
          grep -q "FumeAdapter" "$WEB_ROOT/APP/visualizer-manager.js"
          test -s "$WEB_ROOT/APP/fume/fume.js"
          test -s "$WEB_ROOT/APP/fume-folia/fume-folia.js"
          grep -q "fume-folia.js?v=20261109c" "$WEB_ROOT/index.html"
          grep -q "FumeFoliaBundle" "$WEB_ROOT/APP/fume-folia/fume-folia.js"
          test -s "$WEB_ROOT/APP/fume-adapter.js"
          test -s "$WEB_ROOT/APP/fume-audio.js"
          grep -q "fume-audio.js?v=20261109b" "$WEB_ROOT/index.html"
          grep -q "fume.js?v=20261109c" "$WEB_ROOT/index.html"
          test -s "$WEB_ROOT/APP/tempera-adapter.js"
          test -s "$WEB_ROOT/APP/tempera/tempera.js"
          grep -q "tempera.js?v=20261108i" "$WEB_ROOT/index.html"
          grep -q "window.__TEMPERA_PROFILE__===true" "$WEB_ROOT/APP/tempera/tempera.js"
          grep -q "shotsAvg:" "$WEB_ROOT/APP/tempera/tempera.js"
          grep -q "filtersAvg:" "$WEB_ROOT/APP/tempera/tempera.js"
          grep -q "tempera-adapter.js?v=20261111a" "$WEB_ROOT/index.html"
          test -s "$WEB_ROOT/APP/partita-adapter.js"
          test -s "$WEB_ROOT/APP/runtime/audio-clock.js"
          test -s "$WEB_ROOT/APP/runtime/timeline-scheduler.js"
          test -s "$WEB_ROOT/APP/runtime/frame-scheduler.js"
          test -s "$WEB_ROOT/APP/runtime/render-coordinator.js"
          grep -q "YiuRenderCoordinator" "$WEB_ROOT/APP/runtime/render-coordinator.js"
          grep -q "YiuFrameScheduler.start" "$WEB_ROOT/APP/player.js"
          test -s "$WEB_ROOT/APP/yiu-runtime.js"
          grep -q 'runtime.sample(ct, i)' "$WEB_ROOT/APP/player.js"
          grep -q 'resolveLineIndex:resolveLineIndex' "$WEB_ROOT/APP/yiu-runtime.js"
          grep -q 'getLineIndex: getLineIndex' "$WEB_ROOT/APP/runtime/timeline-scheduler.js"
          grep -q 'lineIndexMode' "$WEB_ROOT/APP/yiu-runtime.js"
          grep -q "adapter-v10-word-clock-suspend" "$WEB_ROOT/APP/partita-adapter.js"
          grep -q 'wordAnimationEnd=' "$WEB_ROOT/APP/P1.js"
          grep -q 'g>=t.startTime&&g<=h' "$WEB_ROOT/APP/P1.js"
          grep -q 'y>=b&&y<=h' "$WEB_ROOT/APP/P1.js"
          grep -q 'resolution: options.tuning.textureResolution,' "$WEB_ROOT/APP/sonnet/sonnet.js"
          ! grep -q 'resolution: snapResolutionToTexturePool(width, height, options.tuning.textureResolution)' "$WEB_ROOT/APP/sonnet/sonnet.js"
          grep -q 'sonnet.js?v=20261102c' "$WEB_ROOT/index.html"
          grep -q 'sonnet-adapter.js?v=20261111a' "$WEB_ROOT/index.html"
          grep -q 'P1.js?v=20261107c' "$WEB_ROOT/index.html"
          test -s "$WEB_ROOT/APP/playback-service.js"
          test -s "$WEB_ROOT/APP/lyrics-service.js"
          test -s "$WEB_ROOT/APP/library-service.js"
          grep -q 'APP/playback-service.js?v=1' "$WEB_ROOT/index.html"
          grep -q 'APP/lyrics-service.js?v=1' "$WEB_ROOT/index.html"
          grep -q 'APP/library-service.js?v=1' "$WEB_ROOT/index.html"
          grep -q 'APP/playback-preferences-service.js?v=1' "$WEB_ROOT/index.html"
          grep -q 'var playbackPreferences = window.YiuPlaybackPreferences;' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'playbackPreferences ? playbackPreferences.getPlayMode() : 0' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'playbackPreferences.setPlayMode(window.playMode)' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'localStorage.setItem("playModeV1"' "$WEB_ROOT/APP/mini-player.js"
          grep -q "YiuPlayback.notify('lyricschange')" "$WEB_ROOT/APP/renderer.js"
          grep -q 'window.YiuLibrary || window.SongLibrary' "$WEB_ROOT/APP/ios-music.js"
          ! grep -q 'npTimer\|setInterval(npRefresh' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'window.YiuPlayback.*subscribe' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'window.YiuLibrary.*subscribe' "$WEB_ROOT/APP/mini-player.js"
          grep -q 'var SL = window.YiuLibrary || window.SongLibrary;' "$WEB_ROOT/APP/player.js"
          grep -q 'var library = window.YiuLibrary || window.SongLibrary;' "$WEB_ROOT/APP/player.js"
          echo "VisualizerManager drive diagnostics in packaged resource:"
          grep -n "drive" "$WEB_ROOT/APP/visualizer-manager.js" || true
          grep -q 'driveFaults' "$WEB_ROOT/APP/visualizer-manager.js"
          grep -q "warn('drive " "$WEB_ROOT/APP/visualizer-manager.js"
          grep -q 'NAMES\[i\], e)' "$WEB_ROOT/APP/visualizer-manager.js"
          grep -q 'if (!active || suspended || !currentTimeObj)' "$WEB_ROOT/APP/partita-adapter.js" && ! grep -q 'setSuspended: function (v) { this.hide(); }' "$WEB_ROOT/APP/partita-adapter.js"
          grep -q 'driveFaults' "$WEB_ROOT/APP/visualizer-manager.js"
          echo "Verified Run #13 UI, event-driven mini-player, service facades, migrated iOS import consumer, and all four engine payloads in $WEB_ROOT"
          du -sh "$WEB_ROOT"

      - name: Package IPA
        run: |
          mkdir -p YiuFM/output/Payload
          cp -R YiuFM/build/Build/Products/Release-iphoneos/*.app YiuFM/output/Payload/Yiu.fm.app
          cd YiuFM/output
          /usr/bin/zip -qry YiuFM-2.0-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: YiuFM-2.0-unsigned-ipa
          path: YiuFM/output/YiuFM-2.0-unsigned.ipa
